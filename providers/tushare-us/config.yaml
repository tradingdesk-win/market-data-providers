id: tushare-us
name: Tushare Pro 美股
description: Tushare Pro 美股日线行情（运行时注入 API Token）
version: 1.0.0
enabled: false
supported_markets: [US]
supported_types: [STOCK]
api:
  base_url: https://api.tushare.pro
  timeout: 10s
  max_retry: 2
  retry_backoff: 1s
  headers:
    Content-Type: application/json
  kline:
    endpoint: https://api.tushare.pro
    method: POST
    date_format: "20060102"
    params:
      api_name: us_daily
      token: '${TUSHARE_TOKEN}'
      fields: ts_code,trade_date,open,high,low,close,pre_close,vol,amount
      ts_code: '{{symbol}}'
      start_date: '{{startDate}}'
      end_date: '{{endDate}}'
response:
  encoding: utf-8
  format: json
  kline:
    data_path: data.items
    row_format: array
    field_mapping:
      timestamp: {index: 1, type: time, formats: ['20060102'], day_close_time: '16:00:00'}
      open_px: {index: 2, type: float}
      high_px: {index: 3, type: float}
      low_px: {index: 4, type: float}
      close_px: {index: 5, type: float}
      volume: {index: 7, type: float}
      turnover_value: {index: 8, type: float}
symbol:
  output_template: '{{code}}'
period_mapping: {1d: day}
limits:
  supported_periods: [1d]
metadata:
  token_env: TUSHARE_TOKEN
  token_required: true
  rate_limit: '依 Tushare Pro 账号积分与接口限流策略；us_daily 需要相应美股权限'
  verification_status: endpoint_schema_verified_fixture_only
  verification_scope: '官方 us_daily 合约与 AAPL 代码格式；未进行带用户 Token 的在线请求'
  test_symbol: AAPL
auth:
  type: api_key
  fields:
    - name: token
      label: Tushare API Token
      secret: true
      required: true
      env: TUSHARE_TOKEN
