id: tushare
name: Tushare
description: Tushare Pro 日线行情（运行时注入 API Token）
version: 1.0.0
enabled: false
api:
  base_url: https://api.tushare.pro
  timeout: 10s
  max_retry: 2
  retry_backoff: 1s
  headers:
    Content-Type: application/json
  kline:
    endpoint: https://api.tushare.pro
    method: POST
    date_format: "20060102"
    params:
      api_name: daily
      token: '${TUSHARE_TOKEN}'
      fields: ts_code,trade_date,open,high,low,close,vol,amount,turnover_rate
      ts_code: '{{symbol}}'
      start_date: '{{startDate}}'
      end_date: '{{endDate}}'
response:
  encoding: utf-8
  format: json
  kline:
    data_path: data.items
    row_format: array
    field_mapping:
      timestamp: {index: 1, type: time, formats: ['20060102'], day_close_time: '15:00:00'}
      open_px: {index: 2, type: float}
      high_px: {index: 3, type: float}
      low_px: {index: 4, type: float}
      close_px: {index: 5, type: float}
      volume: {index: 6, type: float, transform: multiply:100}
      turnover_value: {index: 7, type: float, transform: multiply:1000}
      turnover_ratio: {index: 8, type: float}
symbol:
  passthrough: true
period_mapping: {1d: day}
limits:
  supports_turnover: true
  supported_periods: [1d]
metadata:
  token_env: TUSHARE_TOKEN
  token_required: true
  rate_limit: '依 Tushare Pro 账号积分与接口限流策略'
  api_key_validation: '启动或启用前必须提供非空 TUSHARE_TOKEN；禁止将 token 写入配置文件'
supported_markets: [CN]
supported_types: [STOCK]
