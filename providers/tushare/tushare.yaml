id: tushare
name: Tushare
description: Tushare Pro 日线行情（运行时注入 API Token）
version: 1.0.0
enabled: false
api:
    base_url: https://api.tushare.pro
    timeout: 10s
    max_retry: 2
    retry_backoff: 1s
    headers:
        Content-Type: application/json
    kline:
        endpoint: https://api.tushare.pro
        method: POST
        params:
            api_name: daily
            end_date: '{{endDate}}'
            fields: ts_code,trade_date,open,high,low,close,vol,amount,turnover_rate
            start_date: '{{startDate}}'
            token: ${TUSHARE_TOKEN}
            ts_code: '{{symbol}}'
    trend:
        endpoint: ""
        method: GET
    realtime:
        endpoint: ""
        method: GET
    batch_realtime:
        endpoint: ""
        method: GET
response:
    encoding: utf-8
    format: json
    kline:
        data_path: data.items
        row_format: array
        field_mapping:
            close_px:
                index: 5
                type: float
            high_px:
                index: 3
                type: float
            low_px:
                index: 4
                type: float
            open_px:
                index: 2
                type: float
            timestamp:
                index: 1
                type: time
                formats:
                    - "20060102"
                day_close_time: "15:00:00"
            turnover_ratio:
                index: 8
                type: float
            turnover_value:
                index: 7
                type: float
                transform: multiply:1000
            volume:
                index: 6
                type: float
                transform: multiply:100
    trend:
        data_path: ""
        row_format: ""
        field_mapping: {}
    realtime:
        data_path: ""
        row_format: ""
        field_mapping: {}
    batch_realtime:
        data_path: ""
        row_format: ""
        field_mapping: {}
symbol:
    output_template: ""
    passthrough: true
period_mapping:
    1d: day
limits:
    supported_periods:
        - 1d
    supports_turnover: true
metadata:
    api_key_validation: 启动或启用前必须提供非空 TUSHARE_TOKEN；禁止将 token 写入配置文件
    rate_limit: 依 Tushare Pro 账号积分与接口限流策略
    source_type: imported
    token_env: TUSHARE_TOKEN
    token_required: true
    verification_status: unverified
supported_markets:
    - CN
supported_types:
    - STOCK
